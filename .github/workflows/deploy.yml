name: Deploy OpenScroll to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The scripture sources are large and immutable, so cache them between
      # runs rather than re-downloading ~60 MB on every deploy.
      - name: Cache scripture sources
        uses: actions/cache@v4
        with:
          path: .data-cache
          key: openscroll-sources-v1

      - run: npm ci

      - name: Build scripture data
        run: npm run data

      - name: Build site
        run: npm run build
        env:
          # Serves from https://<user>.github.io/<repo>/
          OPENSCROLL_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
